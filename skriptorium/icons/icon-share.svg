<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Geteilte Links">
  <!-- Feste Farben im Asset, denn ein <img> erbt keine Tokens: die dunkle Fläche #33424d und der Akzent #00b4cc des Standard-Themes (Akzent im dunklen Schema, 4,1:1 auf der Fläche). -->
  <rect width="32" height="32" fill="#33424d"/>
  <!-- Drei Knoten, zwei Verbindungen: eine Adresse wandert weiter. -->
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round">
    <circle cx="10" cy="16" r="3"/>
    <circle cx="22" cy="9" r="3"/>
    <path d="M12.7 14.6l6.6-4M12.7 17.4l6.6 4"/>
  </g>
  <circle cx="22" cy="23" r="3" fill="#00b4cc"/>
</svg>
