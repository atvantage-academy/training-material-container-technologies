<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Konfiguration">
  <!-- Feste Farben im Asset, denn ein <img> erbt keine Tokens: die dunkle Fläche #33424d und der Akzent #00b4cc des Standard-Themes (Akzent im dunklen Schema, 4,1:1 auf der Fläche). -->
  <rect width="32" height="32" fill="#33424d"/>
  <!-- Drei Schieberegler: Einstellungen, die man je Site anders stellt. -->
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round">
    <path d="M7 11h18M7 21h18"/>
    <circle cx="13" cy="11" r="2.6"/>
  </g>
  <circle cx="20" cy="21" r="2.6" fill="#00b4cc" stroke="#33424d" stroke-width="2.2"/>
</svg>
