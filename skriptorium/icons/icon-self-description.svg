<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Selbstauskunft">
  <!-- Feste Farben im Asset, denn ein <img> erbt keine Tokens: die dunkle Fläche #33424d und der Akzent #00b4cc des Standard-Themes (Akzent im dunklen Schema, 4,1:1 auf der Fläche). -->
  <rect width="32" height="32" fill="#33424d"/>
  <!-- Ein Blatt wie bei der Seite (icon-page), aber mit einem Etikett statt einer
       umgeknickten Ecke: Das Paket traegt ein Schild, auf dem steht, was es ist. -->
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round">
    <path d="M8 6h16v20H8z"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round">
    <path d="M12 19h8M12 23h5"/>
  </g>
  <!-- Das Etikett: die Auskunft selbst. -->
  <path d="M12 10h8v5h-8z" fill="#00b4cc"/>
</svg>
