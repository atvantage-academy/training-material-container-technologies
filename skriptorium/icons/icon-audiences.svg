<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Zielgruppen">
  <!-- Feste Farben im Asset, denn ein <img> erbt keine Tokens: die dunkle Fläche #33424d und der Akzent #00b4cc des Standard-Themes (Akzent im dunklen Schema, 4,1:1 auf der Fläche). -->
  <rect width="32" height="32" fill="#33424d"/>
  <!-- Zwei Gruppen nebeneinander - die eine hervorgehoben: gebaut wird immer eine. -->
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round">
    <circle cx="11" cy="12" r="3.2"/>
    <path d="M6 24v-1.5a5 5 0 0 1 10 0V24"/>
  </g>
  <g fill="#00b4cc">
    <circle cx="22" cy="12" r="3.2"/>
    <path d="M17 24v-1.5a5 5 0 0 1 10 0V24z"/>
  </g>
</svg>
