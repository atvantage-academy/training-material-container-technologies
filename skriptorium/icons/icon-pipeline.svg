<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="GitHub Pages">
  <!-- Feste Farben im Asset, denn ein <img> erbt keine Tokens: die dunkle Fläche #33424d und der Akzent #00b4cc des Standard-Themes (Akzent im dunklen Schema, 4,1:1 auf der Fläche). -->
  <rect width="32" height="32" fill="#33424d"/>
  <!-- Quelle, Bauschritt, Veroeffentlichung: drei Stationen, ein Weg. -->
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round">
    <circle cx="8" cy="16" r="3"/>
    <circle cx="16" cy="16" r="3"/>
    <path d="M11 16h2M19 16h2"/>
  </g>
  <circle cx="24" cy="16" r="3" fill="#00b4cc"/>
</svg>
