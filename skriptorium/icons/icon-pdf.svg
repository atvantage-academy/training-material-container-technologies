<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="#0f6e7a" role="img" aria-label="PDF">
  <!-- Die Füllfarbe gilt nur ohne Maskenunterstützung: der Grundton des Akzents im Standard-Theme. Sonst färbt components.css das Zeichen über die Maske in der Farbe des Verweises. -->
  <!-- Blatt mit umgeknickter Ecke – kein Markenzeichen, sondern die Gattung „Datei zum
       Herunterladen". Getroffen wird sie an der Endung, nicht an einer Domain.

       EIN PFAD, EINE FARBE, Aussparungen per `evenodd`: Die Buchstaben und der Eckknick
       sind LÖCHER, nicht weiss aufgemalt. Nur so überlebt das Icon eine Maske – und die
       braucht es, damit es die Akzentfarbe der Site trägt statt immer das Marken-Orange.
       Weiss aufgemalt wäre in der Maske deckend und das Blatt eine leere Fläche. -->
