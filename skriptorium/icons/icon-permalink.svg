<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Permalink">
  <!-- Feste Farben im Asset, denn ein <img> erbt keine Tokens: die dunkle Fläche #33424d und der Akzent #00b4cc des Standard-Themes (Akzent im dunklen Schema, 4,1:1 auf der Fläche). -->
  <rect width="32" height="32" fill="#33424d"/>
  <!-- Zwei Kettenglieder: eine Adresse, die haelt. Das rechte traegt die
       Akzentfarbe - es ist das kurze, das nie wechselt. -->
  <g fill="none" stroke-width="2.4" stroke-linecap="round">
    <path d="M14 18.5l-2.5 2.5a3.9 3.9 0 01-5.5-5.5l3.5-3.5a3.9 3.9 0 015.5 0" stroke="#ffffff"/>
    <path d="M18 13.5l2.5-2.5a3.9 3.9 0 015.5 5.5l-3.5 3.5a3.9 3.9 0 01-5.5 0" stroke="#00b4cc"/>
  </g>
</svg>
