<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Barrierefreiheit">
  <!-- Feste Farben im Asset, denn ein <img> erbt keine Tokens: die dunkle Fläche #33424d und der Akzent #00b4cc des Standard-Themes (Akzent im dunklen Schema, 4,1:1 auf der Fläche). -->
  <rect width="32" height="32" fill="#33424d"/>
  <!-- Die Figur mit ausgebreiteten Armen, wie sie das Zugaenglichkeits-Zeichen
       fuehrt: ein Mensch, nicht ein Haken auf einer Liste. -->
  <circle cx="16" cy="9" r="2.6" fill="#00b4cc"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round">
    <path d="M8 14h16"/>
    <path d="M16 14v6"/>
    <path d="M16 20l-4 6M16 20l4 6"/>
  </g>
</svg>
