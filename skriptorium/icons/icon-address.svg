<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Adressen">
  <!-- Feste Farben im Asset, denn ein <img> erbt keine Tokens: die dunkle Fläche #33424d und der Akzent #00b4cc des Standard-Themes (Akzent im dunklen Schema, 4,1:1 auf der Fläche). -->
  <rect width="32" height="32" fill="#33424d"/>
  <!-- Ein Pfad aus zwei Abschnitten, getrennt durch Schraegstriche: /ordner/seite.
       Der letzte Abschnitt ist orange - das ist der Slug, um den es geht. -->
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round">
    <path d="M7 21l3-11M17 21l3-11"/>
    <path d="M11 16h4"/>
  </g>
  <path d="M23 16h3" fill="none" stroke="#00b4cc" stroke-width="2.2" stroke-linecap="round"/>
</svg>
