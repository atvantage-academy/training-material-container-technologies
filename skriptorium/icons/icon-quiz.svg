<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Wissens-Check">
  <!-- Feste Farben im Asset, denn ein <img> erbt keine Tokens: die dunkle Fläche #33424d und der Akzent #00b4cc des Standard-Themes (Akzent im dunklen Schema, 4,1:1 auf der Fläche). -->
  <rect width="32" height="32" fill="#33424d"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Drei Antworten zur Wahl -->
    <path d="M9 11h14M9 16h14M9 21h8"/>
  </g>
  <!-- Die eine, die stimmt -->
  <path d="M20 21l2.2 2.2L27 18.4" fill="none" stroke="#00b4cc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
