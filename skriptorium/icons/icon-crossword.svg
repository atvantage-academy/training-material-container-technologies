<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Kreuzworträtsel">
  <!-- Feste Farben im Asset, denn ein <img> erbt keine Tokens: die dunkle Fläche #33424d und der Akzent #00b4cc des Standard-Themes (Akzent im dunklen Schema, 4,1:1 auf der Fläche). -->
  <rect width="32" height="32" fill="#33424d"/>
  <!-- Zwei Wörter, die sich kreuzen -->
  <g fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round">
    <path d="M4.5 13.5h23v6h-23zM10.5 13.5v6M22.5 13.5v6"/>
    <path d="M16.5 5.5h6v8M16.5 5.5v8M16.5 19.5v6h6v-6"/>
  </g>
  <!-- Der Buchstabe, den beide teilen -->
  <rect x="17.3" y="14.3" width="4.4" height="4.4" fill="#00b4cc"/>
</svg>
