<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Bausteine">
  <!-- Feste Farben im Asset, denn ein <img> erbt keine Tokens: die dunkle Fläche #33424d und der Akzent #00b4cc des Standard-Themes (Akzent im dunklen Schema, 4,1:1 auf der Fläche). -->
  <rect width="32" height="32" fill="#33424d"/>
  <!-- Zwei gesetzte Steine und einer, der dazukommt: die Ergaenzungs-Ebene. -->
  <g fill="none" stroke="#ffffff" stroke-width="2.2">
    <rect x="7"  y="17" width="8" height="8" rx="1.5"/>
    <rect x="17" y="17" width="8" height="8" rx="1.5"/>
  </g>
  <rect x="12" y="7" width="8" height="8" rx="1.5" fill="#00b4cc"/>
</svg>
