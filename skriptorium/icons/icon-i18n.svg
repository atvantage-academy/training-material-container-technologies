    <circle cx="16" cy="16" r="9"/>
    <path d="M7 16h18"/>
    <path d="M16 7c2.6 2.6 3.9 5.7 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.7-3.9-9S13.4 9.6 16 7z"/>
  </g>
  <circle cx="16" cy="16" r="2.4" fill="#00b4cc"/>
</svg>
